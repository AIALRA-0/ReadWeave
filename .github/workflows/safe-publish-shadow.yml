name: safe-publish shadow

# Run the shared gate for real changes without blocking the repository during the pilot.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# The reusable scanner only needs to read the checked-out repository.
permissions:
  contents: read

jobs:
  # Pin both the reusable workflow and its scanner input to the same immutable commit.
  safe-publish:
    uses: AIALRA-0/agent-github-safe-publish/.github/workflows/reusable-safe-publish.yml@a8224d52916fad78a1cb2f85e3e2d548bef309c6
    with:
      tool_ref: a8224d52916fad78a1cb2f85e3e2d548bef309c6
      shadow: true

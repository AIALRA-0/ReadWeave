services:
  readweave:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${READWEAVE_IMAGE:-readweave:0.104.1}
    container_name: readweave
    restart: unless-stopped
    env_file:
      - ${READWEAVE_VERIFIER_ENV_FILE:?Set READWEAVE_VERIFIER_ENV_FILE to the private verifier environment file}
    ports:
      - "${READWEAVE_BIND:-127.0.0.1:11802}:8080"
    volumes:
      - ${READWEAVE_DATA_DIR:?Set READWEAVE_DATA_DIR to the persistent data directory}:/home/node/trilium-data

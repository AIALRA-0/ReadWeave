services:
  readweave:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${READWEAVE_IMAGE:-readweave:0.104.1}
    container_name: readweave
    restart: unless-stopped
    env_file:
      - /srv/aialra/secrets/readweave-verifier.env
    ports:
      - "${READWEAVE_BIND:-127.0.0.1:11802}:8080"
    volumes:
      - ${READWEAVE_DATA_DIR:-/srv/readweave/data}:/home/node/trilium-data

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - validate

default:
  image: node:24-alpine
  tags:
    - readweave
  interruptible: true
  before_script:
    - apk add --no-cache git

variables:
  GIT_DEPTH: "0"

privacy-policy:
  stage: validate
  script:
    - |
      if git cat-file -e "${CI_COMMIT_BEFORE_SHA}^{commit}" 2>/dev/null; then
        export READWEAVE_PRIVACY_BASELINE="$CI_COMMIT_BEFORE_SHA"
      else
        export READWEAVE_PRIVACY_BASELINE="HEAD~1"
      fi
      node scripts/readweave/privacy-scan.mjs --all-changes

evaluation-isolation:
  stage: validate
  script:
    - node scripts/readweave/verify-eval-isolation.mjs
